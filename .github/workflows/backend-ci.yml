name: Backend CI

on:
  push:
    branches: [backend]
    paths:
      - "fraud-replay/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "fraud-replay/backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_DB: fraud_replay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fraud_replay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: fraud-replay/backend
    env:
      APP_NAME: Fraud Replay CI
      APP_ENV: test
      DEBUG: "false"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: fraud_replay_test
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      JWT_SECRET_KEY: ci-only-jwt-secret-that-is-longer-than-thirty-two-characters
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CORS_ORIGINS: '["http://localhost:5173"]'
      MAX_UPLOAD_SIZE_MB: "10"
      MAX_TRANSACTIONS_PER_UPLOAD: "10000"
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: fraud-replay/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Ruff
        run: python -m ruff check .
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Check migration drift
        run: python -m alembic check
      - name: Test with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Validate Docker build
        run: docker build --tag fraud-replay-backend:ci .
